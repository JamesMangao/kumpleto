name: kumpleto_tools
description: >-
  Repo-root tooling for Kumpleto: data validation, compilation to data.json,
  and staleness reporting. Pure Dart — runs on Windows and Linux CI.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.13.5

dependencies:
  crypto: ^3.0.6
  json_schema: ^5.2.2
  yaml: ^3.1.4
  # Shared hash/schema/release contract; the app depends on the same package.
  kumpleto_data_contract:
    path: packages/data_contract

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.3

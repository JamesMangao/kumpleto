# Bundle — status: draft until verified by the human maintainer.
schema_version: 1
id: job-hunt-pack
name:
  en: Job Hunt Pack
  fil: Job Hunt Pack
description:
  en: >-
    A starter set of documents commonly asked for when applying for jobs in
    the Philippines. Community-curated — confirm each requirement with the
    employer or issuing agency.
  fil: >-
    Set ng mga dokumentong karaniwang hinihingi kapag nag-aaplay ng trabaho
    sa Pilipinas. Kurado ng komunidad — kumpirmahin ang bawat requirement sa
    employer o ahensya.
status: draft
documents:
  - psa-birth-certificate
  - nbi-clearance
  - police-clearance
  - barangay-clearance
  - philsys-national-id
  - sss
  - philhealth
tags: [job-hunt, first-time]
icon: work
notes:
  - en: >-
      First Time Jobseekers Assistance Act (RA 11261) — fees and charges are
      waived for first-time jobseekers on the government documents required for
      employment: police clearance, NBI clearance, barangay clearance, medical
      certificate from a public hospital (laboratory tests and other medical
      procedures are still paid for), birth certificate, marriage certificate,
      transcript of records from state colleges and universities, TIN, UMID, and
      other government-issued documentary requirements an employer may ask for
      (Sec. 4). Not covered: PRC licensure examinations, DFA passport
      authentication and red ribbon, the CSC Career Service Examination, and the
      LTO driver's license (Sec. 8). The benefit may be availed of only once, and
      you must present a barangay certification stating that you are a first-time
      jobseeker (Secs. 3 and 5).
    fil: >-
      First Time Jobseekers Assistance Act (RA 11261) — waived ang mga bayad at
      singil sa mga first-time jobseeker para sa mga dokumentong kailangan sa
      pag-aapply ng trabaho: police clearance, NBI clearance, barangay
      clearance, medical certificate mula sa public hospital (bayad pa rin ang
      laboratory tests at iba pang medical procedure), birth certificate,
      marriage certificate, transcript of records mula sa state colleges and
      universities, TIN, UMID, at iba pang dokumentong inilalabas ng gobyerno na
      maaaring hingin ng employer (Sec. 4). Hindi saklaw: PRC licensure
      examinations, passport authentication at red ribbon ng DFA, Career Service
      Examination ng CSC, at driver's license ng LTO (Sec. 8). Isang beses lang
      magagamit ang benepisyo, at kailangang ipakita ang barangay certification
      na nagsasabing first-time jobseeker ka (Secs. 3 at 5).
  - en: >-
      Source: Republic Act No. 11261 (First Time Jobseekers Assistance Act),
      Secs. 3–8. Your barangay or the local PESO can help you file the
      application (Sec. 7).
    fil: >-
      Pinagmulan: Republic Act No. 11261 (First Time Jobseekers Assistance Act),
      Secs. 3–8. Matutulungan ka ng iyong barangay o ng lokal na PESO sa
      paghahain ng aplikasyon (Sec. 7).

# Kumpleto agencies registry.
# Schema (validated by tools/validate.dart):
#   - id: kebab-case, unique, matches list position conventions
#   - name: {en, fil} — official agency name is the same in both languages
#   - website: official https URL, or null when no single national site exists
#
# All URLs verified reachable at authoring time and re-checked 2026-11-09;
# several agency sites block automated requests (403) but are the canonical
# official .gov.ph domains. See TODO.md — the human maintainer confirms each
# URL during verification.

- id: nbi
  name:
    en: National Bureau of Investigation
    fil: National Bureau of Investigation
  website: https://www.nbi.gov.ph/

- id: psa
  name:
    en: Philippine Statistics Authority
    fil: Philippine Statistics Authority
  website: https://psa.gov.ph/


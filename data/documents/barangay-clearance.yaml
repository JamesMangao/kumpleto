# Barangay clearance: the same document for every barangay in the country.
#
# A barangay clearance is issued by the barangay where the applicant lives, so
# this entry names no particular barangay. The place is supplied by the user's
# saved location (Settings → My location) and substituted into the text at
# render time through the placeholders below:
#
#   {{barangay}}  "Barangay Pacita 1" / "your barangay"
#   {{city}}      "City of San Pedro" / "your city or municipality"
#   {{address}}   "Barangay Pacita 1, City of San Pedro, Laguna 4023"
#                 / "your barangay, city and province"
#
# Placeholders are filled only inside a sentence, always after a preposition —
# the fallbacks ("your barangay") read as a noun phrase, never as a headline.
# With no location saved the entry still reads correctly, just without names.
#
# What is *not* localized, deliberately: the fee is a range because each
# barangay sets its own through a revenue ordinance, and the cedula rule differs
# per hall. The requirement set is the standard national one, and the two laws
# cited (RA 11032 on processing time, RA 11261 on the first-time jobseeker fee
# waiver) apply everywhere.
schema_version: 1
id: barangay-clearance
name:
  en: Barangay Clearance
  fil: Barangay Clearance
agency: barangay
status: verified
last_verified: '2026-11-02'
verified_by: JamesMangao
source_url: https://psa.gov.ph/classification/psgc
apply_online: false
validity_months: 6
summary:
  en: >-
    Clearance issued by the barangay where you live, asked for by employers,
    schools and business permits. This entry is filled in for {{address}}. Each
    barangay sets its own requirements and fees, so confirm yours at the hall.
  fil: >-
    Clearance na inilalabas ng barangay kung saan ka nakatira, hinihingi ng
    employer, eskwelahan at business permit. Nakasagot ang entry na ito para sa
    {{address}}. Bawat barangay ang nagtatakda ng requirement at bayad, kaya
    kumpirmahin sa barangay hall ninyo.
tags: [job-hunt, clearance, residency]
where_to_apply:
  en: >-
    The hall of {{barangay}} in {{city}}. Barangay halls follow the city or
    municipality's working hours; go on a weekday morning to avoid the queue.
    For a business clearance, RA 11032 moved the application to the city's
    Business One-Stop Shop, with the fee still accruing to the barangay.
  fil: >-
    Ang hall ng {{barangay}} sa {{city}}. Sumusunod ang barangay hall sa oras ng
    trabaho ng lungsod o munisipalidad; pumunta sa umaga ng weekday para iwas
    pila. Para sa business clearance, inilipat ng RA 11032 ang application sa
    Business One-Stop Shop ng lungsod, at sa barangay pa rin napupunta ang bayad.
requirements:
  - id: accomplished-form
    text:
      en: >-
        Duly accomplished barangay clearance application form, available at the
        barangay hall counter.
      fil: >-
        Nasagutang barangay clearance application form, makukuha sa counter ng
        barangay hall.
    original: true
  - id: proof-of-residence
    text:
      en: >-
        Valid government ID that shows your address in {{barangay}} — or, if you
        have none yet, proof of residency such as a utility bill, lease
        contract, or barangay certification from a household head.
      fil: >-
        Valid na ID ng gobyerno na nakasaad ang address mo sa {{barangay}} — o,
        kung wala pa, patunay ng paninirahan tulad ng utility bill, lease
        contract, o barangay certification mula sa household head.
    original: true
  - id: cedula
    text:
      en: >-
        Current-year Cedula (Community Tax Certificate). Many barangays require
        it before releasing a clearance — confirm at the hall.
      fil: >-
        Cedula (Community Tax Certificate) para sa kasalukuyang taon. Karaniwang
        hinihingi ito bago ilabas ang clearance — kumpirmahin sa barangay hall.
    original: true
    optional: true
  - id: photo
    text:
      en: >-
        Recent 1x1 or 2x2 ID photo, if the barangay still requires one for the
        clearance.
      fil: >-
        Bagong 1x1 o 2x2 ID photo, kung hinihingi pa ito ng barangay para sa
        clearance.
    optional: true
  - id: clearance-fee
    text:
      en: >-
        Payment of the barangay clearance fee, with an official receipt. Free for
        first-time jobseekers under RA 11261 with the required oath.
      fil: >-
        Bayad sa barangay clearance, may opisyal na resibo. Libre para sa
        first-time jobseeker sa ilalim ng RA 11261 kapag may oath na kailangan.
  - id: business-documents
    text:
      en: >-
        Business clearance only: DTI or SEC registration, Mayor's permit
        application, lease contract or proof of ownership of the site.
      fil: >-
        Para sa business clearance lang: DTI o SEC registration, application ng
        Mayor's permit, lease contract o patunay ng pagmamay-ari ng lugar.
    original: true
    optional: true
steps:
  - en: >-
      Go to the hall of {{barangay}} on a weekday and ask the duty clerk for the
      clearance application form.
    fil: >-
      Pumunta sa hall ng {{barangay}} sa araw ng trabaho at humingi ng clearance
      application form sa duty clerk.
  - en: >-
      Fill in the form and state the purpose — employment, business, scholarship
      or travel. The purpose is printed on the clearance.
    fil: >-
      Sagutan ang form at isaad ang purpose — trabaho, negosyo, scholarship o
      biyahe. Nakaprinta ang purpose sa clearance.
  - en: >-
      Present your valid ID or proof of residence, and your cedula if the
      barangay requires it.
    fil: >-
      Ipakita ang valid ID o patunay ng paninirahan, at ang cedula kung
      hinihingi ng barangay.
  - en: >-
      Pay the clearance fee at the barangay treasurer's desk and keep the
      official receipt.
    fil: >-
      Bayaran ang clearance fee sa desk ng barangay treasurer at itago ang
      opisyal na resibo.
  - en: >-
      Claim the signed and sealed clearance. Read the name, address and validity
      dates before leaving the counter.
    fil: >-
      Kunin ang clearance na may pirma at selyo. Basahin ang pangalan, address
      at validity date bago lumayo sa counter.
  - en: >-
      First-time jobseekers: ask for the separate First Time Job Seeker
      certification, which is the proof RA 11261 requires for waived fees.
    fil: >-
      First-time jobseeker: humingi ng hiwalay na First Time Job Seeker
      certification, ito ang patunay na kailangan ng RA 11261 para sa waived na
      bayarin.
fee_note:
  en: >-
    A personal clearance is typically ₱20–₱100, set by the barangay's own
    revenue ordinance — confirm the exact amount at the hall of {{barangay}}.
    Free for first-time jobseekers under RA 11261.
  fil: >-
    Karaniwang ₱20–₱100 ang personal na clearance, ayon sa revenue ordinance ng
    barangay — kumpirmahin ang eksaktong halaga sa hall ng {{barangay}}. Libre
    para sa first-time jobseeker sa ilalim ng RA 11261.
processing_note:
  en: >-
    Usually released the same day, in minutes when the hall is not busy. RA 11032
    caps simple barangay transactions at one working day.
  fil: >-
    Karaniwang same day, ilang minuto kapag walang pila. Ayon sa RA 11032, isang
    araw ng trabaho lang ang dapat hintayin sa simpleng transaksyon sa barangay.
notes:
  - en: >-
      The barangay in your saved location is matched to the PSA Philippine
      Standard Geographic Code (3Q 2026), so the address printed on this entry
      follows the official name of your barangay.
    fil: >-
      Ang barangay sa naka-save na lokasyon mo ay naka-base sa PSA Philippine
      Standard Geographic Code (3Q 2026), kaya sumusunod ang address sa entry na
      ito sa opisyal na pangalan ng barangay ninyo.
  - en: >-
      Barangay halls post their own fee schedule and office hours at the
      counter. Ask to see it, and ask whether a cedula is needed before you
      queue — that rule differs from one barangay to the next.
    fil: >-
      Naglalagay ng sariling fee schedule at office hours ang barangay hall sa
      counter. Hilingin itong makita, at itanong kung kailangan ang cedula bago
      pumila — iba-iba ang patakarang ito sa bawat barangay.

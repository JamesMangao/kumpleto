# PRC Professional License (Initial Registration)
# Facts sourced from https://www.prc.gov.ph/prc-frequently-asked-questions
# (registration requirements and fees for successful examinees, mandatory
# oath-taking with QR-tagged attendance, COR/PIC released on the registration
# date, three-year PIC renewal). Verified against the FAQ page on 2026-11-06
# at the maintainer's request.
schema_version: 1
id: prc-license
name:
  en: PRC Professional License (Initial Registration)
  fil: PRC Professional License (Initial Registration)
agency: prc
status: verified
last_verified: '2026-11-06'
verified_by: JamesMangao
source_url: https://www.prc.gov.ph/prc-frequently-asked-questions
apply_online: true
apply_online_url: https://online.prc.gov.ph/
validity_months: 36
summary:
  en: >-
    Registration of a board passer with the Professional Regulation
    Commission, which issues the Certificate of Registration and the
    Professional Identification Card (PRC ID). Required before practising as a
    licensed professional — nurse, engineer, teacher, accountant, architect,
    and the other regulated professions.
  fil: >-
    Pagpaparehistro ng nakapasa sa board exam sa Professional Regulation
    Commission, na naglalabas ng Certificate of Registration at Professional
    Identification Card (PRC ID). Kailangan ito bago magpraktis bilang
    lisensyadong propesyonal — nurse, engineer, teacher, accountant, arkitekto,
    at iba pang regulated na propesyon.
tags: [professional, license, board-exam, prc]
where_to_apply:
  en: >-
    Online initial registration through the PRC Online Services (LERIS) portal,
    then submission of requirements at the PRC regional office or offsite
    service center you chose.
  fil: >-
    Online na initial registration sa PRC Online Services (LERIS) portal,
    pagkatapos isumite ang mga requirement sa PRC regional office o offsite
    service center na pinili mo.
requirements:
  - id: registration-form
    text:
      en: >-
        Screenshot of the system-generated Registration Form from your LERIS
        initial registration.
      fil: >-
        Screenshot ng system-generated Registration Form mula sa iyong LERIS
        initial registration.
    original: true
  - id: valid-id
    text:
      en: One (1) valid government-issued ID.
      fil: Isang (1) valid na ID ng gobyerno.
    original: true
  - id: oath-form
    text:
      en: >-
        Oath Form with the unique QR code generated by the online oathtaking
        registration. Your attendance must be tagged at the oath-taking.
      fil: >-
        Oath Form na may natatanging QR code mula sa online oathtaking
        registration. Kailangang ma-tag ang attendance mo sa oath-taking.
    original: true
  - id: payment
    text:
      en: >-
        Registration fee plus the annual renewal fee, assessed by the system
        before you pay.
      fil: >-
        Registration fee at annual renewal fee, na ina-assess ng system bago ka
        magbayad.
  - id: board-requirements
    text:
      en: >-
        Profession-specific requirements of your Professional Regulatory Board,
        e.g. a surety bond for Real Estate Brokers and Appraisers, or the
        official receipt of APO membership fee payment for Agricultural and
        Biosystems Engineers, Environmental Planners, and Interior Designers.
      fil: >-
        Mga requirement na tukoy sa Professional Regulatory Board mo, hal.
        surety bond para sa Real Estate Broker at Appraiser, o opisyal na
        resibo ng bayad sa APO membership para sa Agricultural and Biosystems
        Engineer, Environmental Planner, at Interior Designer.
    original: true
    optional: true
steps:
  - en: >-
      Pass the licensure examination, or qualify for registration without
      examination, and wait for your name to appear in the official results.
    fil: >-
      Pumasa sa licensure examination, o maging kuwalipikado sa registration
      without examination, at hintayin ang pangalan mo sa opisyal na resulta.
  - en: >-
      Register online for oath-taking at the PRC Online Services portal to
      generate your Oath Form with a QR code.
    fil: >-
      Mag-register online para sa oath-taking sa PRC Online Services portal para
      makabuo ng Oath Form na may QR code.
  - en: >-
      Attend the oath-taking so your attendance is tagged — the PRC states that
      untagged attendance cannot proceed to initial registration.
    fil: >-
      Dumalo sa oath-taking para ma-tag ang attendance mo — ayon sa PRC, hindi
      makakapagpatuloy sa initial registration kapag hindi na-tag.
  - en: >-
      Log in to LERIS, choose Initial Registration, and pay the assessed
      registration fee.
    fil: >-
      Mag-log in sa LERIS, piliin ang Initial Registration, at bayaran ang
      in-assess na registration fee.
  - en: >-
      Submit the system-generated Registration Form and your valid ID at your
      chosen PRC office on the appointment date, and claim your Certificate of
      Registration and PRC ID.
    fil: >-
      Isumite ang system-generated Registration Form at valid ID sa piniling
      PRC office sa appointment date, at kunin ang Certificate of Registration
      at PRC ID.
fee_note:
  en: >-
    For professions requiring a baccalaureate degree: ₱600 registration fee plus
    ₱450 annual renewal fee (₱1,050 total). For non-baccalaureate professions:
    ₱450 plus ₱420 (₱870 total). Medical Representatives and Real Estate
    Salespersons pay a ₱450 accreditation fee.
  fil: >-
    Para sa propesyon na nangangailangan ng baccalaureate degree: ₱600
    registration fee at ₱450 annual renewal fee (₱1,050 kabuuan). Para sa
    non-baccalaureate: ₱450 at ₱420 (₱870 kabuuan). Ang Medical Representative
    at Real Estate Salesperson ay may ₱450 accreditation fee.
fee_min: 870
fee_max: 1050
processing_note:
  en: >-
    The PRC states that the Certificate of Registration and the Professional
    Identification Card are released on the date of your registration.
  fil: >-
    Ayon sa PRC, inilalabas ang Certificate of Registration at Professional
    Identification Card sa mismong araw ng registration mo.
processing_days_min: 0
processing_days_max: 0
depends_on:
  - prc-board-exam
notes:
  - en: >-
      The PRC ID (Professional Identification Card) is renewed every three (3)
      years: ₱450 for baccalaureate professions, ₱420 for non-baccalaureate.
    fil: >-
      Ang PRC ID (Professional Identification Card) ay nire-renew tuwing
      tatlong (3) taon: ₱450 para sa baccalaureate na propesyon, ₱420 para sa
      non-baccalaureate.
  - en: >-
      Married female applicants submit the PSA Marriage Certificate so the
      married name appears on the registration and the ID.
    fil: >-
      Ang mga babaeng may asawa ay nagsusumite ng PSA Marriage Certificate para
      lumabas ang married name sa registration at sa ID.

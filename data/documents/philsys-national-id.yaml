# Seed entry — status: draft until verified by the human maintainer.
# Requirements/steps below follow the official page named in source_url;
# the maintainer still confirms every line before setting status: verified.
schema_version: 1
id: philsys-national-id
name:
  en: PhilSys National ID
  fil: PhilSys National ID
agency: philsys
status: draft
source_url: https://philsys.gov.ph/
apply_online: false
summary:
  en: >-
    The national ID from the Philippine Identification System. Registration
    and the ePhilID are free; the physical card arrives later.
  fil: >-
    Ang national ID mula sa Philippine Identification System. Libre ang
    registration at ang ePhilID; darating sa ibang pagkakataon ang pisikal na
    card.
tags: [id, first-time]
where_to_apply:
  en: >-
    Any PSA registration center, mall or LGU satellite site running PhilSys
    Step 2 registration.
  fil: >-
    Kahit anong PSA registration center, mall o LGU satellite site na may
    PhilSys Step 2 registration.
requirements:
  - id: application-form
    text:
      en: >-
        Accomplished PhilSys registration form (given on site, or partly filled
        online).
      fil: >-
        Nasagutang PhilSys registration form (ibinibigay sa site, o bahagyang
        online).
    original: true
  - id: psa-birth
    text:
      en: >-
        PSA birth certificate on security paper.
      fil: >-
        PSA birth certificate sa security paper.
    original: true
  - id: valid-id
    text:
      en: >-
        One supporting government ID or a barangay certification if no ID is
        available yet.
      fil: >-
        Isang supporting government ID o barangay certification kung wala pang ID.
    original: true
  - id: marriage-certificate
    text:
      en: >-
        For married applicants whose marital status changed: PSA marriage
        certificate.
      fil: >-
        Para sa kasal na aplikante: PSA marriage certificate.
    original: true
    optional: true
steps:
  - en: >-
      Book a slot online where slots are offered, or walk in to a registration
      center during posted hours.
    fil: >-
      Mag-book ng slot online kung may inaalok, o mag-walk in sa registration
      center sa oras na nakapaskil.
  - en: >-
      Present the originals at the demographic data capture station and confirm
      every spelling before it is saved.
    fil: >-
      Ipakita ang mga orihinal sa demographic capture station at tiyakin ang
      bawat spelling bago i-save.
  - en: >-
      Complete biometrics: fingerprint capture, iris scan and photograph.
    fil: >-
      Kumpletuhin ang biometrics: fingerprint, iris scan at litrato.
  - en: >-
      Keep the transaction slip. It is what you show while the physical card has
      not arrived.
    fil: >-
      Itago ang transaction slip. Ito ang ipapakita habang wala pa ang card.
  - en: >-
      Download the ePhilID from the PhilSys site or app once the record is
      ready, and use it as a valid ID.
    fil: >-
      I-download ang ePhilID sa PhilSys site o app kapag ready na ang record, at
      gamitin ito bilang valid ID.
fee_note:
  en: >-
    Registration, the ePhilID and the physical card are free of charge.
  fil: >-
    Libre ang registration, ang ePhilID at ang pisikal na card.
processing_note:
  en: >-
    Registration takes about 15–30 minutes on site; the physical card is
    delivered later and can take months.
  fil: >-
    Ang registration ay mga 15–30 minuto sa site; ang pisikal na card ay
    darating pagkalipas ng ilang buwan.

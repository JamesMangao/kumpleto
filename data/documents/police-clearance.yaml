# Seed entry — status: draft until verified by the human maintainer.
# Requirements/steps below follow the official page named in source_url;
# the maintainer still confirms every line before setting status: verified.
schema_version: 1
id: police-clearance
name:
  en: Police Clearance
  fil: Police Clearance
agency: pnp
status: draft
source_url: https://pnpclearance.ph/
apply_online: true
apply_online_url: https://pnpclearance.ph/
validity_months: 6
summary:
  en: >-
    National Police Clearance issued by the Philippine National Police. Apply
    and pay online, then appear at the branch for biometrics.
  fil: >-
    National Police Clearance mula sa Philippine National Police. Mag-apply at
    magbayad online, pagkatapos pumunta sa branch para sa biometrics.
tags: [clearance, job-hunt, travel]
where_to_apply:
  en: >-
    Any PNP clearance branch or satellite office you select during the online
    application.
  fil: >-
    Kahit anong PNP clearance branch o satellite office na pipiliin mo sa
    online application.
requirements:
  - id: appointment
    text:
      en: >-
        Online application reference and the chosen branch and schedule.
      fil: >-
        Reference ng online application at ang napiling branch at schedule.
    original: true
  - id: valid-id
    text:
      en: >-
        One valid government ID with photo, original and not expired.
      fil: >-
        Isang valid na ID ng gobyerno na may litrato, orihinal at hindi expired.
    original: true
  - id: payment-receipt
    text:
      en: >-
        Proof of payment from the online payment channel.
      fil: >-
        Patunay ng bayad mula sa online payment channel.
    original: true
  - id: photo
    text:
      en: >-
        Recent 2x2 photo, if the branch asks for one.
      fil: >-
        Bagong 2x2 photo, kung hihingin ng branch.
    optional: true
steps:
  - en: >-
      Register at pnpclearance.ph and fill in your personal details.
    fil: >-
      Mag-register sa pnpclearance.ph at isulat ang personal na detalye.
  - en: >-
      Pay the clearance fee online and keep the reference number.
    fil: >-
      Bayaran ang clearance fee online at itago ang reference number.
  - en: >-
      Choose a branch and schedule, then appear for the photo, fingerprints and
      signature.
    fil: >-
      Pumili ng branch at schedule, pagkatapos pumunta para sa litrato,
      fingerprints at pirma.
  - en: >-
      Claim the printed clearance, or download the digital copy if your branch
      releases it electronically.
    fil: >-
      Kunin ang nakaprintang clearance, o i-download ang digital copy kung
      electronic ang release.
fee_note:
  en: >-
    About ₱150 for the clearance plus the online transaction fee. Confirm the
    current rate on the application page.
  fil: >-
    Mga ₱150 para sa clearance dagdag ang online transaction fee. Kumpirmahin
    ang rate sa application page.
processing_note:
  en: >-
    Same day at most branches once the biometrics are captured.
  fil: >-
    Same day sa karamihan ng branch kapag nakuha na ang biometrics.

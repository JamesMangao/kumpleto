name: kumpleto
description: "Unofficial offline-first checklist of Philippine government document requirements. Not affiliated with any government agency."
publish_to: 'none'

# versionName = 0.1.0, versionCode = 1 (Android), file version (Windows)
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  http: ^1.6.0
  package_info_plus: ^10.2.2
  flutter_localizations:
    sdk: flutter
  drift: ^2.35.2
  sqlite3_flutter_libs: ^0.6.0+eol
  crypto: ^3.0.7
  path_provider: ^2.1.6
  # Shared hash/schema/release contract - same package the repo tooling uses,
  # so the app's verify gate can never drift from what the compiler published.
  kumpleto_data_contract:
    path: ../packages/data_contract

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  # Directory asset: always contains the release-safe data.json.
  # The dev-only data_drafts.json is generated here by
  # `dart run tools/build_data.dart --include-drafts` (gitignored, never
  # present in release/CI builds — see docs/DECISIONS.md P3).
  assets:
    - assets/data/
    - assets/logo/
    # Offline place names (PSA PSGC, CC BY 4.0): index + one shard per
    # province, built by tools/build_psgc.py.
    - assets/psgc/
    - assets/psgc/bgy/

  generate: true

# Launcher icon generation. The single source of truth for the brand mark is
# app/assets/logo/app-icon.png — the same file the app shows in-app and the
# splash uses. Replace that one file, then run:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  # No iOS target in this repo (Android-only release).
  ios: false
  image_path: "assets/logo/app-icon.png"
  adaptive_icon_background: "#0068FD"
  # The master is a full-bleed square, so the adaptive layer reuses it and
  # insets it into the 66% safe zone rather than a separate cut-out layer.
  adaptive_icon_foreground: "assets/logo/app-icon-adaptive.png"
  adaptive_icon_foreground_inset: 0

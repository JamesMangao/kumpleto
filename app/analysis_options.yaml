include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    todo: ignore
  exclude:
    - build/**
    - android/**

linter:
  rules:
    # Extra strictness on top of flutter_lints.
    - always_declare_return_types
    - avoid_dynamic_calls
    - directives_ordering
    - prefer_const_declarations
    - prefer_final_locals
    - unnecessary_lambdas
